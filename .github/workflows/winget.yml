name: Winget

# Publishes the released installer to winget (microsoft/winget-pkgs) once a
# GitHub Release leaves draft. Needs the WINGET_TOKEN secret (docs/release.md);
# without it the job fails visibly rather than silently skipping.
on:
  release:
    types: [published]

jobs:
  winget:
    runs-on: windows-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: FranzGerster.FGScanner
          installers-regex: '-win-x64\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
