name: Winget

# Publishes the released installer to winget (microsoft/winget-pkgs) once a
# GitHub Release leaves draft. Off until the repo variable WINGET_ENABLED=true:
# the action can only update a package that already exists in winget-pkgs, so
# before the first manual submission every release showed a failure that meant
# nothing. Setup, including the WINGET_TOKEN secret, is in docs/release.md.
on:
  release:
    types: [published]

jobs:
  winget:
    if: vars.WINGET_ENABLED == 'true'
    runs-on: windows-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: FranzGerster.FGScanner
          installers-regex: '-win-x64\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
