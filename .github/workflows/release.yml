name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Version from tag
        id: ver
        shell: pwsh
        run: '"version=$($env:GITHUB_REF_NAME.TrimStart(''v''))" >> $env:GITHUB_OUTPUT'

      - name: Publish app
        run: >
          dotnet publish src/FgScanner.App/FgScanner.App.csproj -c Release
          -p:PublishProfile=win-x64
          -p:Version=${{ steps.ver.outputs.version }}

      - name: Publish CLI
        run: >
          dotnet publish src/FgScanner.Cli/FgScanner.Cli.csproj -c Release
          -r win-x64 --self-contained false
          -o publish/win-x64
          -p:Version=${{ steps.ver.outputs.version }}

      # --- Payload signing via SignPath (enable by setting the repo variable SIGNPATH_ENABLED=true
      #     and the secrets documented in docs/release.md). Runs BEFORE the installer is packed.
      - name: Upload payload for signing
        if: vars.SIGNPATH_ENABLED == 'true'
        id: payload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: publish-payload
          path: publish/win-x64

      - name: Sign payload (SignPath)
        if: vars.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: fgScanner
          signing-policy-slug: release-signing
          artifact-configuration-slug: publish-payload
          github-artifact-id: ${{ steps.payload_artifact.outputs.artifact-id }}
          # Without output-artifact-directory the action signs but never downloads the result,
          # so the installer would be packed from the UNSIGNED payload.
          output-artifact-directory: publish/win-x64
          wait-for-completion: true

      - name: Portable ZIP (config beside exe)
        shell: pwsh
        run: |
          New-Item dist -ItemType Directory -Force | Out-Null
          Copy-Item build/installer/portable-readme.txt publish/win-x64/README-PORTABLE.txt
          Compress-Archive -Path publish/win-x64/* -DestinationPath dist/fgscanner-${{ steps.ver.outputs.version }}-win-x64-portable.zip

      - name: Install Inno Setup 7
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          # "$env:ProgramFiles(x86)" expands to "C:\Program Files(x86)" — the space is lost and the
          # path never matches. ${env:ProgramFiles(x86)} is the form that survives the parser.
          $roots = @("${env:ProgramFiles(x86)}\Inno Setup*", "$env:ProgramFiles\Inno Setup*")
          $iscc = Get-ChildItem $roots -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue |
                  Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $iscc) {
            throw "ISCC.exe not found under: $($roots -join '; ')"
          }
          Write-Host "Using $($iscc.FullName)"
          & $iscc.FullName /DAppVersion=${{ steps.ver.outputs.version }} build\installer\setup.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Upload installer for signing
        if: vars.SIGNPATH_ENABLED == 'true'
        id: installer_artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/*.exe

      - name: Sign installer (SignPath)
        if: vars.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: fgScanner
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.installer_artifact.outputs.artifact-id }}
          # Signed installer replaces the unsigned one before checksums and appcast are generated.
          output-artifact-directory: dist
          wait-for-completion: true

      # Appcast for auto-update: generated + Ed25519-signed per docs/release.md, then uploaded
      # with the release so NetSparkle finds it at releases/latest/download/appcast.xml.
      - name: Generate appcast (if key configured)
        if: vars.APPCAST_ENABLED == 'true'
        shell: pwsh
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
        run: |
          dotnet tool install --global NetSparkleUpdater.Tools.AppCastGenerator
          # Write the key pair to a key-path directory rather than relying on env-var pickup:
          # this is the exact invocation verified locally against the real key pair.
          # The public key is not a secret — it ships in UpdateService.Ed25519PublicKey.
          $keyDir = Join-Path $env:RUNNER_TEMP 'sparkle-keys'
          New-Item $keyDir -ItemType Directory -Force | Out-Null
          $env:SPARKLE_PRIVATE_KEY.Trim() | Out-File "$keyDir\NetSparkle_Ed25519.priv" -NoNewline -Encoding ascii
          'AYGJKjx0kHdK1dPayOwD71kSEa4yS7j0iVMofJ9RVm4=' | Out-File "$keyDir\NetSparkle_Ed25519.pub" -NoNewline -Encoding ascii
          # -b is the binaries directory, -a the output directory. They are different flags;
          # passing only -a leaves the search at "." and silently finds nothing.
          netsparkle-generate-appcast -b dist -a dist -e exe -o windows -n "FG Scanner" `
            --key-path $keyDir `
            -u https://github.com/fgerster1/fgScanner/releases/latest/download/
          Remove-Item $keyDir -Recurse -Force
          # NetSparkle in SecurityMode.Strict fetches <appcast-url>.signature to verify the feed,
          # so a missing signature file means every client silently sees "no update available".
          foreach ($f in 'dist\appcast.xml', 'dist\appcast.xml.signature') {
            if (-not (Test-Path $f)) { throw "$f was not generated" }
          }

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist\* -Include *.exe,*.zip | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash) *$($_.Name)"
          } | Out-File dist\SHA256SUMS.txt -Encoding ascii

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.exe
            dist/*.zip

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/appcast.xml
            dist/appcast.xml.signature
          generate_release_notes: true
          draft: true
