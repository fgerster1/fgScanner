name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Version from tag
        id: ver
        shell: pwsh
        run: '"version=$($env:GITHUB_REF_NAME.TrimStart(''v''))" >> $env:GITHUB_OUTPUT'

      - name: Publish app
        run: >
          dotnet publish src/FgScanner.App/FgScanner.App.csproj -c Release
          -p:PublishProfile=win-x64
          -p:Version=${{ steps.ver.outputs.version }}

      - name: Publish CLI
        run: >
          dotnet publish src/FgScanner.Cli/FgScanner.Cli.csproj -c Release
          -r win-x64 --self-contained false
          -o publish/win-x64
          -p:Version=${{ steps.ver.outputs.version }}

      # --- Payload signing via SignPath (enable by setting the repo variable SIGNPATH_ENABLED=true
      #     and the secrets documented in docs/release.md). Runs BEFORE the installer is packed.
      - name: Sign payload (SignPath)
        if: vars.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: fgScanner
          signing-policy-slug: release-signing
          artifact-configuration-slug: publish-payload
          github-artifact-id: ''
          wait-for-completion: true

      - name: Portable ZIP (config beside exe)
        shell: pwsh
        run: |
          New-Item dist -ItemType Directory -Force | Out-Null
          Copy-Item build/installer/portable-readme.txt publish/win-x64/README-PORTABLE.txt
          Compress-Archive -Path publish/win-x64/* -DestinationPath dist/fgscanner-${{ steps.ver.outputs.version }}-win-x64-portable.zip

      - name: Install Inno Setup 7
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "$env:ProgramFiles(x86)\Inno Setup*","$env:ProgramFiles\Inno Setup*" -Filter ISCC.exe -Recurse | Select-Object -First 1
          & $iscc.FullName /DAppVersion=${{ steps.ver.outputs.version }} build\installer\setup.iss

      - name: Sign installer (SignPath)
        if: vars.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: fgScanner
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ''
          wait-for-completion: true

      # Appcast for auto-update: generated + Ed25519-signed per docs/release.md, then uploaded
      # with the release so NetSparkle finds it at releases/latest/download/appcast.xml.
      - name: Generate appcast (if key configured)
        if: vars.APPCAST_ENABLED == 'true'
        shell: pwsh
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
        run: |
          dotnet tool install --global NetSparkleUpdater.Tools.AppCastGenerator
          netsparkle-generate-appcast -a dist -e exe -o windows `
            --key-path-override env --description "FG Scanner" `
            -u https://github.com/fgerster1/fgScanner/releases/latest/download/

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist\* -Include *.exe,*.zip | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash) *$($_.Name)"
          } | Out-File dist\SHA256SUMS.txt -Encoding ascii

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.exe
            dist/*.zip

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/appcast.xml
          generate_release_notes: true
          draft: true
